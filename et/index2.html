<script>let currentVisibleBubble=null;let hideTimer=null;document.addEventListener('DOMContentLoaded',function(){const helpWrappers=document.querySelectorAll('.help-icon-wrapper');helpWrappers.forEach(wrapper=>{const bubble=wrapper.querySelector('.help-bubble, .help-bubble2');wrapper.addEventListener('click',function(e){e.stopPropagation();if(currentVisibleBubble&&currentVisibleBubble!==bubble){currentVisibleBubble.classList.remove('show')}if(hideTimer){clearTimeout(hideTimer)}if(currentVisibleBubble===bubble){bubble.classList.remove('show');currentVisibleBubble=null}else{currentVisibleBubble=bubble;bubble.classList.add('show');hideTimer=setTimeout(()=>{if(currentVisibleBubble===bubble){bubble.classList.remove('show');currentVisibleBubble=null}},5000)}})});document.addEventListener('click',function(event){if(currentVisibleBubble&&!event.target.closest('.help-icon-wrapper')){currentVisibleBubble.classList.remove('show');currentVisibleBubble=null;if(hideTimer){clearTimeout(hideTimer)}}})});</script>
<script>
const developerReplies = ["视觉的失焦，是为了让逻辑的焦点更锐利。","算法在混乱的边缘起舞，为你锚定那唯一的交点。","表象是无序的噪点，内核是绝对的几何。","眼睛看向虚空，却为你锁定了最坚实的坐标。","以混沌为基，以逻辑为尺，丈量你与要塞的距离。","在这双失焦的眼眸里，坐标是唯一的真理。","这双眼睛看不清世界，却能看清世界生成的种子。","乱中有序，歪中见准。","在随机性的迷雾中，为你点亮那盏确定性的灯。","逻辑锚定虚空。","眼斜，心不斜。","歪瞳的视线模糊了，但它的指引从未如此清晰。","在这看似混乱的飞行中，蕴藏着通往要塞的秘密。","混沌显形，坐标即真理。","2026.7.5-17:03 ，更新日志 ：也许修复了多余的显示......也许吧。",];function getRandomReply() {return developerReplies[Math.floor(Math.random() * developerReplies.length)];}function adj(id, d) {const i = document.getElementById(id);i.value = (parseFloat(i.value) || 0) + d;}function calc() {const errorContainer = document.querySelector(".My-Name-Is-Error");const errorTextElement = document.getElementById("My-Name-Is-Error");const x1 = +document.getElementById("x1").value || 0;const z1 = +document.getElementById("z1").value || 0;const x2 = +document.getElementById("x2").value || 0;const z2 = +document.getElementById("z2").value || 0;const x3 = +document.getElementById("x3").value || 0;const z3 = +document.getElementById("z3").value || 0;const x4 = +document.getElementById("x4").value || 0;const z4 = +document.getElementById("z4").value || 0;const resultCard = document.getElementById("resultCard");try {const inputs = ["x1", "z1", "x2", "z2", "x3", "z3", "x4", "z4"];for (let id of inputs) {const val = document.getElementById(id).value.trim();if (val !== "" && isNaN(parseFloat(val))) {throw new Error(`Oh，我可要告诉你，你输入数据包含无效字符：${id}`);}}const dx1 = x2 - x1;const dz1 = z2 - z1;const dx2 = x4 - x3;const dz2 = z4 - z3;const denominator = (dz1 * dx2) - (dx1 * dz2);if (Math.abs(denominator) < 0.00001) {throw new Error("我们一般说要两线相交才能确定坐标，因此，两条视线平行或重合，无法计算交点！");}const cross1 = (x1 * z2) - (z1 * x2);const cross2 = (x3 * z4) - (z3 * x4);const x = (cross1 * dx2 - dx1 * cross2) / denominator;const z = (cross1 * dz2 - dz1 * cross2) / denominator;const y = 36;const startDist = Math.hypot(x3 - x1, z3 - z1);let conf, confText;if (startDist < 100) {conf = "低";confText = "低";} else if (startDist < 300) {conf = "中";confText = "中";} else {conf = "高";confText = "高";}const toFortDist = Math.hypot(x - x4, z - z4);const dx = x1 - x;const dz = z1 - z;let dir = "";const absDx = Math.abs(dx);const absDz = Math.abs(dz);if (Number.isNaN(dx) || Number.isNaN(dz)) {dir = "咱是在哪？";} else if (Math.abs(dx) < 0.001 && Math.abs(dz) < 0.001) {dir = "方向未知";} else {if (absDx < 0.001) {dir = dz > 0 ? "正南" : "正北";}else if (absDz < 0.001) {dir = dx > 0 ? "正东" : "正西";}else if (absDx > absDz) {if (dx > 0) {dir = dz > 0 ? "东南" : "东北";} else {dir = dz > 0 ? "西南" : "西北";}} else {if (dz > 0) {dir = dx > 0 ? "东南" : "西南";} else {dir = dx > 0 ? "东北" : "西北";}}}const rx = Math.round(x);const rz = Math.round(z);const cmd = `/tp @s ${Number.isNaN(rx) ? "~" : rx} ~ ${Number.isNaN(rz) ? "~" : rz}`;document.getElementById("tpCmd").textContent = cmd;document.getElementById("outX").textContent = rx;document.getElementById("outZ").textContent = rz;document.getElementById("distRow").textContent = `${Math.round(toFortDist)} blocks`;document.getElementById("dir").textContent = dir;document.getElementById("conf").textContent = confText;document.getElementById("the-reply-from-the-developer-of-the-mcms.qzz.io-website").textContent = getRandomReply();if (errorTextElement) {errorTextElement.innerHTML = "<strong>无错误</strong>";}if (errorContainer) {errorContainer.classList.remove("show");}if (resultCard) {resultCard.style.display = "block";}} catch (error) {if (errorTextElement) {const safeMsg = error.message.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");errorTextElement.innerHTML = `报错：${safeMsg}`;}if (errorContainer) {errorContainer.classList.add("show");}document.getElementById("tpCmd").textContent = "/tp @s ~ ~ ~";document.getElementById("outX").textContent = "NaN";document.getElementById("outZ").textContent = "NaN";document.getElementById("distRow").textContent = "NaN blocks";document.getElementById("dir").textContent = "未知";document.getElementById("conf").textContent = "无";document.getElementById("
